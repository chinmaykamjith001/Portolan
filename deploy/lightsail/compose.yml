# Portolan on one server: the app container behind Caddy (HTTPS + a login).
# Started by deploy/lightsail/setup.sh; the walkthrough is docs/deploy-lightsail.md.
#
# Only Caddy is reachable from outside (ports 80/443). The app has no published port, so every
# request goes through Caddy's password check first.
name: portolan

services:
  portolan:
    build: ../..
    env_file: ../../.env                  # your key stays on the server, never in the image
    environment:
      PORTOLAN_HOME: /data
      PORTOLAN_CONFIG: /config/portolan.toml
    volumes:
      - portolan-data:/data               # database, cloned code, uploads
      - ../../portolan.toml:/config/portolan.toml:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"                           # only redirects to HTTPS (and answers certificate checks)
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro   # written by setup.sh; not in git
      - caddy-data:/data                  # HTTPS certificates
      - caddy-config:/config
    depends_on:
      - portolan
    restart: unless-stopped

volumes:
  portolan-data:
  caddy-data:
  caddy-config:
