[project]
name = "portolan-papers"
version = "0.0.1"
description = "Explore any paper and its code."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "litellm>=1.50",
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pylatexenc>=2.11",
    "pymupdf>=1.28.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-yaml>=0.7.2",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-toml>=0.7.0",
]

[project.optional-dependencies]
# Heavy (~750 MB with CPU torch, ~29 s import): opt in with `uv sync --extra embeddings`.
# Without it, retrieval is BM25-only (docs/DECISIONS.md).
embeddings = ["sentence-transformers>=6.1"]

[project.scripts]
portolan = "portolan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "syrupy>=4.6",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portolan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: hits real external services (not run in CI; use `pytest -m network`)",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]  # synthetic papers/repos are test data, not our code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["portolan", "tests"]
exclude = ["tests/fixtures", "**/.venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["portolan"]
venvPath = "."
venv = ".venv"
